name: Browser combat
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test Tests/Browser/roster.test.cjs Tests/Browser/combat.test.cjs Tests/Browser/combat-matrix.test.cjs Tests/Browser/fighters.test.cjs
      - run: node tools/build-browser.mjs
